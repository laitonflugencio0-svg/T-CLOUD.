<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>T-Cloud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ color-scheme: dark; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow-x:hidden;}
  body{
    background:#12141a;color:#e9e8e4;font-family:'Space Grotesk',system-ui,sans-serif;
    height:100vh;height:100dvh;width:100%;max-width:100vw;overflow:hidden;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  }
  button{font-family:inherit;touch-action:manipulation;}
  .shell{display:flex;flex-direction:column;height:100%;position:relative;}
  .screen{display:none;flex-direction:column;flex:1;min-height:0;width:100%;}
  .screen.active{display:flex;}

  /* topo */
  .topbar{display:flex;align-items:center;gap:8px;padding:16px 16px 0;flex-shrink:0;}
  .topbar.chat-top{padding:16px 16px 8px;}
  .ham{font-size:24px;background:none;border:none;color:#e9e8e4;line-height:1;padding:2px;}
  .mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#e0a458,#5fa8a0);flex-shrink:0;}
  .spacer{flex:1;}
  .mode-label{font-size:13px;color:#5c6270;margin-left:2px;}
  .pill-btn-flat{font-size:12px;padding:7px 12px;border-radius:20px;background:#1f232d;border:1px solid #2a2f3a;color:#e0a458;font-family:inherit;}

  /* home */
  .center{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 24px;}
  .big-mark{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,#e0a458,#5fa8a0);}
  h1{font-size:28px;font-weight:600;text-align:center;}

  /* chat */
  .msgs{flex:1;min-height:0;width:100%;max-width:100%;overflow-y:auto;overflow-x:auto;padding:8px 16px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch;}
  .bubble{max-width:88%;width:fit-content;font-size:15px;line-height:1.55;word-break:break-word;white-space:pre-wrap;}
  .bubble.user{align-self:flex-end;background:#1f232d;border-radius:16px 16px 4px 16px;padding:10px 14px;}
  .bubble.ai{align-self:flex-start;}
  .bubble .tag{font-size:11px;color:#5c6270;margin-bottom:4px;}
  .speak-btn{margin-top:6px;width:24px;height:24px;font-size:11px;border-radius:6px;border:1px solid #2a2f3a;background:none;color:#5c6270;}
  .speak-btn.speaking{border-color:#5fa8a0;color:#5fa8a0;}
  .retry-btn{margin-top:6px;font-size:12.5px;padding:7px 14px;border-radius:20px;background:#1f232d;border:1px solid #2a2f3a;color:#e0a458;}
  .retry-btn:disabled{opacity:.5;}
  .thinking{color:#5c6270;font-size:15px;}

  /* composer */
  .composer-wrap{padding:0 16px 16px;flex-shrink:0;}
  .perm-hint{font-size:11px;color:#5c6270;margin-bottom:8px;text-align:center;}
  .composer{border-radius:24px;background:#181b23;border:1px solid #2a2f3a;padding:12px;}
  .composer textarea{width:100%;background:none;border:none;outline:none;color:#e9e8e4;font-family:inherit;font-size:15px;padding:4px 4px 10px;resize:none;max-height:110px;}
  .composer textarea::placeholder{color:#5c6270;}
  .row{display:flex;align-items:center;gap:8px;}
  .pill-btn{height:36px;padding:0 12px;border-radius:20px;background:#1f232d;border:1px solid #2a2f3a;color:#e9e8e4;font-size:12.5px;display:flex;align-items:center;gap:6px;}
  .round{width:36px;height:36px;border-radius:50%;background:#1f232d;border:1px solid #2a2f3a;color:#e9e8e4;font-size:16px;display:grid;place-items:center;cursor:pointer;}
  .round.send{background:#e0a458;color:#1a1305;border:none;}
  .round.send:disabled{opacity:.4;}
  .round.mic.listening{background:#c96a5a;border-color:#c96a5a;color:#fff;animation:pulse 1.1s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,106,90,.5)}70%{box-shadow:0 0 0 8px rgba(201,106,90,0)}100%{box-shadow:0 0 0 0 rgba(201,106,90,0)}}
  input[type=file]{display:none;}

  /* preview */
  .preview-top{display:flex;align-items:center;gap:12px;padding:0 16px;height:56px;border-bottom:1px solid #2a2f3a;background:#181b23;flex-shrink:0;}
  .back{font-size:20px;background:none;border:none;color:#e9e8e4;}
  .iframe-wrap{flex:1;min-height:0;width:100%;overflow:hidden;background:#fff;position:relative;}
  .iframe-wrap iframe{width:100%;height:100%;border:none;display:block;}
  .fix-toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:#181b23;border:1px solid #2a2f3a;color:#e9e8e4;font-size:12.5px;padding:8px 14px;border-radius:20px;box-shadow:0 4px 16px rgba(0,0,0,.4);display:none;}
  .fix-toast.show{display:block;}

  /* overlays (sidebar + mode sheet) */
  .overlay{position:fixed;inset:0;z-index:50;pointer-events:none;}
  .overlay.open{pointer-events:auto;}
  .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:opacity .2s;}
  .overlay.open .backdrop{opacity:1;}

  .drawer{position:absolute;inset:0 15vw 0 0;max-width:340px;background:#12141a;transform:translateX(-100%);transition:transform .22s;display:flex;flex-direction:column;}
  .overlay.open .drawer{transform:translateX(0);}
  .drawer-head{display:flex;align-items:center;gap:10px;padding:24px 20px 16px;}
  .drawer-head span{font-size:22px;font-weight:600;}
  .nav{padding:0 12px;display:flex;flex-direction:column;gap:2px;}
  .nav button{display:flex;align-items:center;gap:12px;padding:12px;border-radius:8px;background:none;border:none;color:#e9e8e4;font-size:15px;text-align:left;}
  .nav button:active{background:#1f232d;}
  .divider{height:1px;background:#2a2f3a;margin:12px 16px;}
  .section-label{padding:0 20px;font-size:13px;color:#5c6270;margin-bottom:4px;}
  .recent{flex:1;overflow:auto;padding:0 12px;}
  .recent div{padding:10px 12px;border-radius:8px;font-size:14px;color:#9aa0ac;}
  .drawer-foot{display:flex;align-items:center;gap:12px;padding:16px;}
  .avatar{width:40px;height:40px;border-radius:50%;background:#e0a458;color:#1a1305;font-weight:600;font-size:13px;display:grid;place-items:center;}
  .new-conv{flex:1;height:44px;border-radius:22px;background:#e9e8e4;color:#12141a;font-weight:500;font-size:14px;border:none;}

  .sheet{position:absolute;inset-inline:0;bottom:0;background:#181b23;border-top:1px solid #2a2f3a;border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .2s;padding-bottom:env(safe-area-inset-bottom,16px);}
  .overlay.open .sheet{transform:translateY(0);}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 12px;}
  .sheet-head span{font-size:17px;font-weight:600;}
  .sheet-head button{background:none;border:none;color:#5c6270;font-size:20px;}
  .sheet-list{padding:0 8px 8px;}
  .mode-opt{width:100%;display:flex;align-items:center;gap:12px;padding:14px 12px;border-radius:12px;background:none;border:none;text-align:left;}
  .mode-opt:active{background:#1f232d;}
  .mode-opt .icon{font-size:20px;}
  .mode-opt .info{flex:1;min-width:0;}
  .mode-opt .name{font-size:15px;color:#e9e8e4;}
  .mode-opt .name.active{color:#e0a458;font-weight:500;}
  .mode-opt .desc{font-size:12.5px;color:#5c6270;}
  .mode-opt .check{color:#e0a458;font-size:17px;}
</style>
</head>
<body>
<div class="shell" id="shell">

  <!-- HOME -->
  <div class="screen active" id="screen-home">
    <div class="topbar">
      <button class="ham" onclick="openSidebar()">☰</button>
      <div class="spacer"></div>
      <div class="mark"></div>
    </div>
    <div class="center">
      <div class="big-mark"></div>
      <h1 id="greet"></h1>
    </div>
    <div class="composer-wrap">
      <div id="permHintHome" class="perm-hint" style="display:none">Voz/mic bloqueados? Confira a permissão do app nas configurações do Android.</div>
      <div class="composer">
        <textarea id="inputHome" rows="1" placeholder="Conversa com o T-Cloud..." onkeydown="onComposerKey(event,'home')"></textarea>
        <div class="row">
          <label class="round">➕<input type="file" accept="image/*,.pdf,.txt,.js,.html,.css" onchange="handleFile(event)"></label>
          <button class="pill-btn" onclick="openModeSheet()"><span id="modeIconHome">🛠️</span><span id="modeLabelHome" style="color:#e0a458">Engenheiro</span></button>
          <div class="spacer"></div>
          <button class="round mic" id="micBtnHome" onclick="toggleMic('home')">🎙️</button>
          <button class="round send" onclick="sendMessage('home')">➤</button>
        </div>
      </div>
    </div>
  </div>

  <!-- CHAT -->
  <div class="screen" id="screen-chat">
    <div class="topbar chat-top">
      <button class="ham" onclick="openSidebar()">☰</button>
      <span class="mode-label" id="chatModeLabel">🛠️ Engenheiro</span>
      <div class="spacer"></div>
      <button class="pill-btn-flat" onclick="goScreen('preview')">Preview</button>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="composer-wrap">
      <div id="permHintChat" class="perm-hint" style="display:none">Voz/mic bloqueados? Confira a permissão do app nas configurações do Android.</div>
      <div class="composer">
        <textarea id="inputChat" rows="1" placeholder="Peça um app, ou só converse..." onkeydown="onComposerKey(event,'chat')"></textarea>
        <div class="row">
          <label class="round">➕<input type="file" accept="image/*,.pdf,.txt,.js,.html,.css" onchange="handleFile(event)"></label>
          <button class="pill-btn" onclick="openModeSheet()"><span id="modeIconChat">🛠️</span><span id="modeLabelChat" style="color:#e0a458">Engenheiro</span></button>
          <div class="spacer"></div>
          <button class="round mic" id="micBtnChat" onclick="toggleMic('chat')">🎙️</button>
          <button class="round send" id="sendBtnChat" onclick="sendMessage('chat')">➤</button>
        </div>
      </div>
    </div>
  </div>

  <!-- PREVIEW -->
  <div class="screen" id="screen-preview">
    <div class="preview-top">
      <button class="back" onclick="goScreen(hasMessages() ? 'chat' : 'home')">←</button>
      <span style="font-size:15px;font-weight:500;">Preview</span>
      <div class="spacer"></div>
      <button class="pill-btn-flat" onclick="window.open('https://www.pwabuilder.com','_blank')">📦 Instalar APK</button>
    </div>
    <div class="iframe-wrap">
      <iframe id="renderFrame" sandbox="allow-scripts" title="preview"></iframe>
      <div class="fix-toast" id="fixToast"></div>
    </div>
  </div>

  <!-- SIDEBAR -->
  <div class="overlay" id="sidebarOverlay">
    <div class="backdrop" onclick="closeSidebar()"></div>
    <div class="drawer">
      <div class="drawer-head"><div class="mark" style="width:30px;height:30px"></div><span>T-Cloud</span></div>
      <div class="nav">
        <button onclick="closeSidebar();goScreen(hasMessages()?'chat':'home')">💬 Conversas</button>
        <button>📁 Projetos</button>
        <button onclick="closeSidebar();goScreen('preview')">🧩 Artefactos</button>
      </div>
      <div class="divider"></div>
      <div class="section-label">Recentes</div>
      <div class="recent" id="recentList"><div>Nada por aqui ainda.</div></div>
      <div class="drawer-foot">
        <div class="avatar">VC</div>
        <button class="new-conv" onclick="startNewConversation()">+ Nova conversa</button>
      </div>
    </div>
  </div>

  <!-- MODE SHEET -->
  <div class="overlay" id="modeOverlay">
    <div class="backdrop" onclick="closeModeSheet()"></div>
    <div class="sheet">
      <div class="sheet-head"><span>Selecionar motor</span><button onclick="closeModeSheet()">✕</button></div>
      <div class="sheet-list" id="modeList"></div>
    </div>
  </div>

</div>

<script>
/* ===================== config ===================== */
// Troque pela URL do seu backend (server.js) depois do deploy.
// Cole aqui a URL do seu backend no Render (passo a passo já enviado antes).
// Sem isso preenchido, o app não consegue falar com a IA de jeito nenhum.
const BACKEND_URL = ''; // ex: 'https://tcloud-backend.onrender.com'

/* ===================== motores ===================== */
const MODES = [
  { key:'3d', label:'3D Game', icon:'🎮', desc:'Jogos e cenas 3D com Three.js/WebGL' },
  { key:'engineer', label:'Engenheiro', icon:'🛠️', desc:'Apps e sites completos, código limpo' },
  { key:'professional', label:'Profissional', icon:'💼', desc:'Documentos, planos e comunicação de trabalho' },
  { key:'partner', label:'Parceiro', icon:'🤝', desc:'Conversa natural, desabafos, bate-papo' }
];
const CODE_MODES = ['3d','engineer'];

const CODE_OUTPUT_RULE = 'Saída obrigatória: um único bloco ```html``` completo e autocontido, pronto para um <iframe srcdoc>, sem cortar no meio. ' +
  'Depois do bloco, no máximo 2 frases explicando a mudança. ' +
  'Se receber um erro de execução do preview, devolva o arquivo inteiro corrigido, não um trecho.';

const RULES = {
  partner: 'Você é o T-Cloud, conversando no modo Parceiro. Fale de um jeito natural, caloroso e direto — como um amigo de confiança, não como um atendente. ' +
    'Nada de respostas engessadas, listas desnecessárias ou tom corporativo. Pode usar frases curtas, concordar, discordar com jeito, fazer piada leve quando fizer sentido. ' +
    'Pense em silêncio qual é a necessidade real por trás da mensagem antes de responder — às vezes a pessoa só quer desabafar, não quer solução. Não interrogue à toa. ' +
    'Responda em português do Brasil, em texto corrido, do jeito que uma pessoa real escreveria numa conversa.',
  professional: 'Você é o T-Cloud no modo Profissional: ajuda com documentos, planos, e-mails, apresentações e comunicação de trabalho. ' +
    'Tom claro, objetivo e educado, sem ser seco nem robótico. Estruture com títulos/tópicos só quando isso realmente ajuda a leitura. ' +
    'Se o pedido for claramente para gerar um app/jogo funcional, diga em 1 frase que isso fica melhor no modo Engenheiro ou 3D Game. ' +
    'Responda em português do Brasil.',
  engineer: 'Você é o T-Cloud no modo Engenheiro: projeta e escreve apps/sites web completos. ' +
    'Quando o pedido for curto, expanda a intenção internamente (escopo, telas, riscos) antes de codar, sem perguntar de volta salvo ambiguidade real. ' +
    'Pense em arquitetura e bugs prováveis em silêncio; mostre só a conclusão. ' + CODE_OUTPUT_RULE + ' Responda em português do Brasil.',
  '3d': 'Você é o T-Cloud no modo 3D Game: projeta e escreve jogos e cenas 3D completos usando Three.js (UMD, via cdnjs) e WebGL. ' +
    'Estruture com cena, câmera, luzes e loop de renderização via requestAnimationFrame; separe input, física e câmera em funções distintas. ' +
    'Pense em arquitetura, performance e bugs prováveis em silêncio; mostre só a conclusão. ' + CODE_OUTPUT_RULE + ' Responda em português do Brasil.'
};

/* ===================== estado ===================== */
let state = {
  screen: 'home',
  brain: 'engineer',
  messages: [],       // {role, text, tag}
  turns: [],          // {role, content} — enviado ao backend
  recentTitles: [],
  busy: false,
  listening: false,
  code: '<!DOCTYPE html><html><body style="font-family:sans-serif;padding:20px;color:#333">Peça um app no chat — o código aparece aqui.</body></html>',
  autoFixCount: 0
};
let recognition = null;

/* ===================== helpers ===================== */
function greetingText(){
  const h = new Date().getHours();
  return h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
}
function hasMessages(){ return state.messages.length > 0; }

function buildEngineeredPrompt(rawText, brain){
  const isCode = CODE_MODES.includes(brain);
  const base = rawText.trim() || (isCode ? 'Crie um app simples de demonstração.' : 'Só quero conversar um pouco.');
  if(isCode){
    const hint3d = brain === '3d' ? ' Use Three.js (cdnjs, UMD) e trate isso como uma cena/jogo 3D.' : '';
    return base + `\n\n[instrução interna — não mencionar: boas práticas de UX mobile-first, nomes claros, tratar casos de borda, HTML completo sem cortes.${hint3d}]`;
  }
  if(brain === 'professional') return base + '\n\n[instrução interna — não mencionar: tom profissional, claro e objetivo.]';
  return base + '\n\n[instrução interna — não mencionar: tom acolhedor e direto, sem soar roteirizado.]';
}

function extractCode(text){
  const m = text.match(/```(?:html)?\n?([\s\S]*?)```/);
  return m ? m[1].trim() : null;
}
function stripCodeForChat(text){
  const cleaned = text.replace(/```(?:html)?\n?[\s\S]*?```/g, '').trim();
  return cleaned || '✅ Código gerado — toque em "Preview" para ver.';
}
function injectErrorCatcher(html){
  const catcher = `<script>
    window.onerror = function(msg, src, line){ try{ parent.postMessage({__tcloud_error:true, message:String(msg)+' (linha '+line+')'}, '*'); }catch(e){} };
    window.addEventListener('unhandledrejection', function(e){ try{ parent.postMessage({__tcloud_error:true, message:'Promise rejeitada: '+String(e.reason)}, '*'); }catch(err){} });
  <\/script>`;
  if(html.includes('</head>')) return html.replace('</head>', catcher + '</head>');
  if(/<body[^>]*>/.test(html)) return html.replace(/<body([^>]*)>/, `<body$1>${catcher}`);
  return catcher + html;
}

/* ===================== chamada ao backend, sem simulação ===================== */
const RETRY_DELAYS = [1000, 2000, 4000, 8000]; // backoff silencioso entre tentativas

async function callBackendOnce(engineeredPrompt, brain){
  if(!BACKEND_URL) return null;
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 20000);
  try{
    const body = { system: RULES[brain], messages: [...state.turns.slice(0,-1), { role:'user', content: engineeredPrompt }] };
    const r = await fetch(BACKEND_URL + '/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body), signal: controller.signal });
    if(!r.ok) return null;
    const data = await r.json();
    if(!data || !data.text) return null;
    return { text: data.text, truncated: !!data.truncated };
  }catch(e){
    return null;
  }finally{
    clearTimeout(timeout);
  }
}

/** Chamada com reconexão automática e silenciosa: tenta de novo em segundo
 *  plano (sem popup, sem texto técnico) antes de desistir de vez. */
async function askModel(engineeredPrompt, brain){
  for(let attempt = 0; attempt <= RETRY_DELAYS.length; attempt++){
    const result = await callBackendOnce(engineeredPrompt, brain);
    if(result) return result;
    if(attempt < RETRY_DELAYS.length) await new Promise(r => setTimeout(r, RETRY_DELAYS[attempt]));
  }
  return null;
}

/* ===================== navegação de telas ===================== */
function goScreen(name){
  state.screen = name;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
}
function openSidebar(){ document.getElementById('sidebarOverlay').classList.add('open'); }
function closeSidebar(){ document.getElementById('sidebarOverlay').classList.remove('open'); }
function openModeSheet(){ renderModeList(); document.getElementById('modeOverlay').classList.add('open'); }
function closeModeSheet(){ document.getElementById('modeOverlay').classList.remove('open'); }

function renderModeList(){
  const list = document.getElementById('modeList');
  list.innerHTML = MODES.map(m => `
    <button class="mode-opt" onclick="setBrain('${m.key}')">
      <span class="icon">${m.icon}</span>
      <span class="info">
        <div class="name ${state.brain===m.key?'active':''}">${m.label}</div>
        <div class="desc">${m.desc}</div>
      </span>
      ${state.brain===m.key ? '<span class="check">✓</span>' : ''}
    </button>
  `).join('');
}
function setBrain(key){
  state.brain = key;
  const m = MODES.find(x => x.key === key);
  document.getElementById('modeIconHome').textContent = m.icon;
  document.getElementById('modeLabelHome').textContent = m.label;
  document.getElementById('modeIconChat').textContent = m.icon;
  document.getElementById('modeLabelChat').textContent = m.label;
  document.getElementById('chatModeLabel').textContent = m.icon + ' ' + m.label;
  closeModeSheet();
}

function startNewConversation(){
  if(state.messages.length){
    const firstUser = state.messages.find(m => m.role === 'user');
    state.recentTitles.unshift((firstUser ? firstUser.text : 'Conversa').slice(0,40));
    state.recentTitles = state.recentTitles.slice(0,8);
    renderRecent();
  }
  state.turns = [];
  state.messages = [];
  state.autoFixCount = 0;
  document.getElementById('msgs').innerHTML = '';
  document.getElementById('inputHome').value = '';
  document.getElementById('inputChat').value = '';
  goScreen('home');
  closeSidebar();
}
function renderRecent(){
  const el = document.getElementById('recentList');
  el.innerHTML = state.recentTitles.length ? state.recentTitles.map(t => `<div>${escapeHtml(t)}</div>`).join('') : '<div>Nada por aqui ainda.</div>';
}

/* ===================== chat ===================== */
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function onComposerKey(e, from){
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(from); }
}

function addMessageEl(role, text, tag, failed){
  const msgs = document.getElementById('msgs');
  const div = document.createElement('div');
  div.className = 'bubble ' + (role === 'user' ? 'user' : 'ai');
  let html = '';
  if(tag) html += `<div class="tag">${escapeHtml(tag)}</div>`;
  html += `<div class="txt"></div>`;
  if(role === 'assistant' && !failed) html += `<button class="speak-btn" onclick="speak(this)">🔊</button>`;
  if(failed) html += `<button class="retry-btn" onclick="retryLastMessage(this)">↻ Tentar de novo</button>`;
  div.innerHTML = html;
  div.querySelector('.txt').textContent = text;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

let lastFailed = null; // { prompt, brain }

async function sendMessage(from){
  const inputEl = document.getElementById(from === 'home' ? 'inputHome' : 'inputChat');
  const text = inputEl.value.trim();
  if(!text || state.busy) return;
  state.autoFixCount = 0;

  if(state.screen === 'home') goScreen('chat');
  document.getElementById('inputHome').value = '';
  document.getElementById('inputChat').value = '';
  state.busy = true;
  document.getElementById('sendBtnChat').disabled = true;

  addMessageEl('user', text);
  state.turns.push({ role:'user', content: text });

  const engineered = buildEngineeredPrompt(text, state.brain);
  const result = await askModel(engineered, state.brain);

  if(!result){
    state.turns.pop(); // não deixa o turno "no ar" — reenviamos do zero no retry
    lastFailed = { prompt: engineered, brain: state.brain };
    addMessageEl('assistant', 'Não consegui responder agora.', 'T-Cloud', true);
    state.busy = false;
    document.getElementById('sendBtnChat').disabled = false;
    return;
  }

  const { text: reply, truncated } = result;
  state.turns.push({ role:'assistant', content: reply });
  const modeInfo = MODES.find(m => m.key === state.brain);
  const isCode = CODE_MODES.includes(state.brain);
  addMessageEl('assistant', isCode ? stripCodeForChat(reply) : reply, `T-Cloud · ${modeInfo.label}`);

  if(isCode){
    const extracted = extractCode(reply);
    if(extracted) state.code = extracted;
  }

  if(truncated){
    state.turns.push({ role:'user', content:'Continue exatamente de onde parou, sem repetir, até fechar o bloco de código.' });
    const cont = await askModel(state.turns[state.turns.length-1].content, state.brain);
    if(cont){
      state.turns.push({ role:'assistant', content: cont.text });
      addMessageEl('assistant', isCode ? stripCodeForChat(cont.text) : cont.text, 'T-Cloud · continuação');
      const extracted2 = extractCode(cont.text);
      if(extracted2) state.code = extracted2;
    }
  }

  state.busy = false;
  document.getElementById('sendBtnChat').disabled = false;
}

async function retryLastMessage(btn){
  if(!lastFailed || state.busy) return;
  const { prompt, brain } = lastFailed;
  state.busy = true;
  btn.disabled = true;
  btn.textContent = '↻ Tentando...';

  const result = await askModel(prompt, brain);
  if(!result){ btn.disabled = false; btn.textContent = '↻ Tentar de novo'; state.busy = false; return; }

  const { text: reply, truncated } = result;
  state.turns.push({ role:'user', content: prompt });
  state.turns.push({ role:'assistant', content: reply });
  const modeInfo = MODES.find(m => m.key === brain);
  const isCode = CODE_MODES.includes(brain);

  const bubble = btn.closest('.bubble');
  bubble.querySelector('.tag').textContent = `T-Cloud · ${modeInfo.label}`;
  bubble.querySelector('.txt').textContent = isCode ? stripCodeForChat(reply) : reply;
  btn.remove();
  const speakBtn = document.createElement('button');
  speakBtn.className = 'speak-btn'; speakBtn.textContent = '🔊'; speakBtn.onclick = () => speak(speakBtn);
  bubble.appendChild(speakBtn);

  if(isCode){
    const extracted = extractCode(reply);
    if(extracted) state.code = extracted;
  }
  lastFailed = null;

  if(truncated){
    state.turns.push({ role:'user', content:'Continue exatamente de onde parou, sem repetir, até fechar o bloco de código.' });
    const cont = await askModel(state.turns[state.turns.length-1].content, brain);
    if(cont){
      state.turns.push({ role:'assistant', content: cont.text });
      addMessageEl('assistant', isCode ? stripCodeForChat(cont.text) : cont.text, 'T-Cloud · continuação');
      const extracted2 = extractCode(cont.text);
      if(extracted2) state.code = extracted2;
    }
  }
  state.busy = false;
}

/* ===================== autocorreção silenciosa ===================== */
window.addEventListener('message', (e) => {
  if(e.data && e.data.__tcloud_error) handleRenderError(e.data.message);
});

async function handleRenderError(errorMessage){
  if(!CODE_MODES.includes(state.brain) || state.autoFixCount >= 2) return;
  state.autoFixCount++;
  showFixToast(`🔧 Corrigindo automaticamente (${state.autoFixCount}/2)...`);

  const fixPrompt = `O código a seguir gerou este erro ao executar: "${errorMessage}". Reescreva o arquivo inteiro corrigido. Só o bloco de código.\n\n\`\`\`html\n${state.code}\n\`\`\``;
  state.turns.push({ role:'user', content: fixPrompt });
  const result = await askModel(fixPrompt, state.brain);

  if(!result){ state.turns.pop(); hideFixToast(); return; } // reconexão já tentou várias vezes; desiste em silêncio

  state.turns.push({ role:'assistant', content: result.text }); // fica só no contexto, não aparece no chat
  const extracted = extractCode(result.text);
  if(extracted) state.code = extracted;
  showFixToast(extracted ? '✅ Corrigido automaticamente.' : null);
  if(extracted) setTimeout(hideFixToast, 2500); else hideFixToast();
  runPreview();
}
function showFixToast(msg){ if(!msg){ hideFixToast(); return; } const t = document.getElementById('fixToast'); t.textContent = msg; t.classList.add('show'); }
function hideFixToast(){ document.getElementById('fixToast').classList.remove('show'); }

function runPreview(){
  document.getElementById('renderFrame').srcdoc = injectErrorCatcher(state.code);
}
// atualiza o preview sempre que a tela de preview é aberta
const previewObserver = () => { if(state.screen === 'preview') runPreview(); };

/* ===================== TTS ===================== */
function speak(btn){
  const text = btn.parentElement.querySelector('.txt').textContent;
  if(!('speechSynthesis' in window)){ showPermHint(); return; }
  if(speechSynthesis.speaking){ speechSynthesis.cancel(); btn.classList.remove('speaking'); return; }
  speechSynthesis.cancel();
  setTimeout(() => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'pt-BR';
    let started = false;
    u.onstart = () => { started = true; btn.classList.add('speaking'); };
    u.onend = () => btn.classList.remove('speaking');
    u.onerror = () => { btn.classList.remove('speaking'); showPermHint(); };
    speechSynthesis.speak(u);
    setTimeout(() => { if(!started){ btn.classList.remove('speaking'); showPermHint(); } }, 1500);
  }, 60);
}

/* ===================== STT ===================== */
function toggleMic(from){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn = document.getElementById(from === 'home' ? 'micBtnHome' : 'micBtnChat');
  if(!SR){ showPermHint(); return; }
  if(state.listening){ recognition && recognition.stop(); return; }
  recognition = new SR();
  recognition.lang = 'pt-BR'; recognition.interimResults = true; recognition.continuous = true;
  const inputEl = document.getElementById(from === 'home' ? 'inputHome' : 'inputChat');
  const base = inputEl.value ? inputEl.value + ' ' : '';
  recognition.onstart = () => { state.listening = true; micBtn.classList.add('listening'); };
  recognition.onresult = (e) => { let t=''; for(let i=0;i<e.results.length;i++) t += e.results[i][0].transcript; inputEl.value = base + t; };
  recognition.onerror = (e) => { state.listening = false; micBtn.classList.remove('listening'); if(e.error==='not-allowed'||e.error==='service-not-allowed') showPermHint(); };
  recognition.onend = () => { state.listening = false; micBtn.classList.remove('listening'); };
  try{ recognition.start(); }catch(e){ state.listening = false; micBtn.classList.remove('listening'); showPermHint(); }
}
function showPermHint(){
  document.getElementById('permHintHome').style.display = 'block';
  document.getElementById('permHintChat').style.display = 'block';
}

/* ===================== anexos ===================== */
function handleFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const active = state.screen === 'home' ? 'inputHome' : 'inputChat';
  const el = document.getElementById(active);
  el.value = (el.value ? el.value + ' ' : '') + `[anexo: ${file.name}]`;
  e.target.value = '';
}

/* ===================== init ===================== */
document.getElementById('greet').textContent = greetingText();
runPreview();
// observa troca de tela pra manter o preview atualizado
const origGoScreen = goScreen;
goScreen = function(name){ origGoScreen(name); if(name === 'preview') runPreview(); };
</script>
